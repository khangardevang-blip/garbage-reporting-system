<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Dashboard - EcoReport</title>
    <meta name="description" content="Manage and track garbage complaints efficiently.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    <nav class="navbar dashboard-nav">
        <div class="container nav-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <span>EcoReport Authority</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="btn-outline">Back to Public Site</a>
            </div>
        </div>
    </nav>

    <main class="dashboard-container" id="dashboard-main" style="display: none;">
        <header class="dashboard-header">
            <div>
                <h1>Complaints Dashboard</h1>
                <p>Track, manage, and resolve reported issues in your municipality.</p>
            </div>
            <div class="stats-cards">
                <div class="stat-card">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value text-warning" id="pending-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Resolved</span>
                    <span class="stat-value text-success" id="resolved-count">0</span>
                </div>
            </div>
        </header>

        <section class="controls-section">
            <div class="search-bar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search by location...">
            </div>
            <div class="filter-group">
                <select id="status-filter">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="resolved">Resolved</option>
                </select>
            </div>
        </section>

        <div class="complaints-grid" id="complaints-container">
            <!-- Complaint cards will be injected here via JS -->
            <div class="empty-state" id="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>No complaints found.</p>
            </div>
        </div>
    </main>

    <!-- Login Overlay -->
    <div id="login-overlay" class="login-overlay">
        <div class="glass-card login-card">
            <h2>Authority Login</h2>
            <p>Please enter your credentials to access the dashboard.</p>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <div id="login-error" class="text-warning" style="display: none; margin-bottom: 15px; font-size: 0.875rem;">Invalid username or password.</div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- Modal for full image view -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modal-image" src="" alt="Full view">
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
